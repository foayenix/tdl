[package]
name = "ledger-app"
version = "0.1.5"
edition = "2021"
rust-version = "1.77"
description = "The Deposit Ledger — desktop shell over one SQLite file."
publish = false

[lib]
name = "ledger_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# `bundled` compiles SQLite in, which is also what makes FTS5 available.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sidecar timeout BUILD.md §3 requires. Tauri already runs on tokio; this
# pulls in only the timer.
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
