# Build the macOS .dmg on a tag, and publish it as a release.
#
# There is no Mac in the loop that builds this — a GitHub-hosted runner is the
# Mac. `just tag 0.2.0 && git push origin HEAD --tags` is the whole ritual;
# a .dmg appears under Releases a few minutes later.
#
# The steps are the same recipes you would run by hand on a Mac, in the same
# order, so this file cannot quietly drift from `just dmg`.

name: release

on:
  push:
    tags: ["v*"]
  # Build a .dmg from any branch without tagging, to check the pipeline itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # macos-14 and later are Apple Silicon, which is what this app targets.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install just
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install just

      - name: Install dependencies
        run: |
          just venv
          npm ci

      # A tag is the version. Stamp it before anything is built, so the About
      # box, the crate and the CLI inside the bundle all agree with it.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: just version "${GITHUB_REF_NAME#v}"

      # Apple Silicon refuses to run an arm64 binary with no valid signature,
      # and reports it as "damaged" rather than unsigned — which is what the
      # first v0.1.0 build did on a real Mac. Tauri copies the frozen sidecar
      # into the bundle, so whatever seal the linker left is broken by the
      # time the .app is packaged; it has to be signed after that, which is
      # what Tauri does when it is given an identity.
      #
      # With a Developer ID secret, that identity is the real one and Tauri
      # notarizes too. Without one, "-" is ad-hoc: enough for the app to run,
      # not enough to skip the quarantine step in the release notes.
      - name: Choose a signing identity
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret — signing ad-hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
          echo "Signing and notarizing as ${{ secrets.APPLE_SIGNING_IDENTITY }}."

      # `just dmg` is `freeze`, then `check`, then the bundle: the sidecar the
      # app ships is built first, and the checks run against it. A build of a
      # red tree is not a release (BUILD.md §7).
      - name: Build
        run: just dmg

      # Prove the shipped sidecar runs where there is no Python, which is the
      # whole point of freezing it (BUILD.md §3).
      - name: Verify the sidecar
        run: just verify-freeze

      # Name and upload BEFORE verifying. Twice now a bug in a verification
      # step has thrown away a .dmg that was fine — the check ran before the
      # upload, so a good build left nothing behind at all. The artifact is
      # cheap; a wasted twenty-minute run is not. Verification still gates the
      # release below, so a genuinely bad .dmg cannot be published; it just
      # can no longer make the build disappear.
      - name: Name the artifact after the version
        id: dmg
        run: |
          built="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' 2>/dev/null | head -1)"
          [ -n "$built" ] || { echo "no .dmg was produced" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [ "$version" != "$GITHUB_REF_NAME" ] || version="$(git rev-parse --short HEAD)"
          out="TheDepositLedger-${version}-aarch64.dmg"
          mv "$built" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$out" | tee "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256

      # v0.1.0 shipped with no app inside it. A second [[bin]] in the crate —
      # the preview dumper — was picked up by the bundler as the main binary,
      # so Contents/MacOS/ held that and the sidecar and nothing else. macOS
      # reported it as "damaged", which was true: there was no executable to
      # run.
      #
      # So check the .dmg, and check it by mounting it: look at the app a
      # person would actually drag out. Tauri deletes the staged .app once the
      # .dmg is packaged, which is what an earlier version of this step went
      # looking for.
      - name: Verify the .dmg
        run: |
          dmg="${{ steps.dmg.outputs.path }}"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          trap 'hdiutil detach "$mount" -quiet || true' EXIT

          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "the .dmg holds no .app:" >&2; ls -1 "$mount" >&2; exit 1; }

          # The executable Info.plist names has to be there. This is the check
          # that v0.1.0 would have failed.
          exe="$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          [ -x "$app/Contents/MacOS/$exe" ] || {
            echo "Info.plist names '$exe' but Contents/MacOS/ holds:" >&2
            ls -1 "$app/Contents/MacOS/" >&2
            exit 1
          }

          # The sidecar too — without it the app can neither enrich nor migrate.
          [ -x "$app/Contents/MacOS/ledger" ] || {
            echo "the sidecar is missing from the bundle" >&2; exit 1; }

          # And nothing that has no business shipping.
          if [ -e "$app/Contents/MacOS/preview_dump" ]; then
            echo "preview_dump is in the bundle; it is an example, not a bin" >&2
            exit 1
          fi

          # The signature has to hold with the sidecar inside, or the app will
          # not start on arm64 at all.
          codesign --verify --deep --strict --verbose=2 "$app"

          # And the sidecar has to actually RUN as shipped. `just verify-freeze`
          # above tests build/dist/ledger, which is a different binary: it has
          # not been through Tauri's signing pass. That pass is what broke
          # v0.1.4 — re-signing the sidecar ad-hoc left it unable to dlopen the
          # Python framework it unpacks, because their Team IDs no longer
          # matched, and nothing here noticed until it was installed.
          scratch="$(mktemp -d)"
          "$app/Contents/MacOS/ledger" --db "$scratch/ledger.sqlite" migrate
          "$app/Contents/MacOS/ledger" --db "$scratch/ledger.sqlite" log --minutes 20
          echo "the shipped sidecar migrates and logs"

          echo "the .dmg holds an app that runs: '$exe', a working sidecar, a valid signature"

      # Notes live in .github/release-notes.md so they can be edited without
      # touching this file, and so no heredoc has to survive YAML indentation.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            "${{ steps.dmg.outputs.path }}" \
            "${{ steps.dmg.outputs.path }}.sha256"
